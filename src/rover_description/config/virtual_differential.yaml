virtual_differential:
  ros__parameters:
    imu_topic: /d435i_imu
    joint_states_topic: /joint_states
    left_joint_name: L_Rocker_Joint
    right_joint_name: R_Rocker_Joint
    cmd_topic: /aux_rocker_controller/commands  # ← single topic, Float64MultiArray
    target_pitch_deg: 0.0
    kp: 0.6
    kd: 0.05
    cmd_rate_hz: 50.0
    cmd_limit_deg: 18.5     # ~0.323 rad, matches your URDF revolute limit
    avg_rate_limit_deg_s: 60.0
    invert_pitch: false
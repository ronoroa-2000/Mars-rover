# Global EKF: fuses the local EKF (/odometry/filtered, smooth but drifting) with
# the NDT scan-matching pose (absolute, in the map frame). With world_frame ==
# map_frame it publishes map -> odom; odom -> base_footprint stays with the
# local EKF in ekf_config.yaml. Started by ndt_localize.launch.py.
ekf_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    use_sim_time: false
    permit_correctionless_propagation: true
    two_d_mode: false

    # NDT results arrive ~0.15 s after the scan stamp, so let the filter
    # re-process measurements older than its latest update.
    smooth_lagged_data: true
    history_length: 2.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map
    publish_tf: true

    # Local EKF: velocities only. Its pose lives in the odom frame, so fusing
    # it as a pose would fight the map-frame NDT pose.
    odom0: /odometry/filtered
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom0_queue_size: 10

    # NDT pose of base_footprint in map, from ndt_ekf_bridge.py.
    pose0: /ndt_pose_footprint
    pose0_config: [true,  true,  true,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_differential: false
    pose0_relative: false
    pose0_queue_size: 10
    # Mahalanobis distance; drops NDT results that disagree wildly with the filter.
    pose0_rejection_threshold: 5.0

    # Absolute roll/pitch from gravity, same as the local EKF.
    imu0: /imu/synced
    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
